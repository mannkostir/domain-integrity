name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: npm test
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: npm run test:coverage
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        shell: bash
        run: |
          node -e '
            const { total } = JSON.parse(require("fs").readFileSync("coverage/coverage-summary.json", "utf8"));
            const rows = ["statements", "branches", "functions", "lines"].map((metric) => `| ${metric} | ${total[metric].covered}/${total[metric].total} | ${total[metric].pct}% |`);
            console.log(["## Coverage", "", "| Metric | Covered | Percent |", "| --- | --- | --- |", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: node dist/cli.js --help
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: check
        uses: ./repo
        continue-on-error: true
        with:
          project: repo/test/fixtures/outside-spec/tsconfig.json
          config: repo/test/fixtures/outside-spec/domain.config.ts
          upload: 'false'
      - shell: bash
        env:
          EXIT_CODE: ${{ steps.check.outputs.exit-code }}
          SARIF_FILE: ${{ steps.check.outputs.sarif-file }}
        run: |
          test "$EXIT_CODE" = 1
          test -s "$SARIF_FILE"
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (s.version !== "2.1.0" || s.runs[0].results.length === 0) process.exit(1)' "$SARIF_FILE"
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:pack
